<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img" aria-label="Figure 4.12 Context-Level Level 0 Data Flow Diagram">
  <rect width="1200" height="780" fill="#ffffff"/>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,1 L9,5 L0,9 Z" fill="#000000"/>
    </marker>
  </defs>

  <!-- External entity: Teacher -->
  <rect x="60" y="330" width="180" height="80" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="150" y="365" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#000000">Teacher</text>
  <text x="150" y="388" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#333333">(Instructor)</text>

  <!-- External entity: School Administrator -->
  <rect x="495" y="50" width="210" height="80" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="600" y="85" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#000000">School Administrator</text>
  <text x="600" y="108" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#333333">(Approval / oversight)</text>

  <!-- External entity: OMR Answer Sheet -->
  <rect x="960" y="330" width="180" height="80" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="1050" y="365" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#000000">OMR Answer Sheet</text>
  <text x="1050" y="388" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#333333">(Printed exam form)</text>

  <!-- Process 0 -->
  <circle cx="600" cy="370" r="135" fill="#ffffff" stroke="#000000" stroke-width="2.5"/>
  <text x="600" y="340" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#000000">0</text>
  <text x="600" y="368" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#000000">Hybrid Offline-First</text>
  <text x="600" y="390" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#000000">OMR System</text>
  <text x="600" y="415" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#333333">Mobile + API + Web Portal</text>

  <!-- Teacher to System (upper) -->
  <line x1="240" y1="345" x2="465" y2="300" stroke="#000000" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="330" y="300" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#000000">Roster, answer keys,</text>
  <text x="330" y="315" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#000000">PIN unlock, sync request</text>

  <!-- System to Teacher (lower) -->
  <line x1="465" y1="440" x2="240" y2="395" stroke="#000000" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="350" y="455" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#000000">Scores, review flags,</text>
  <text x="350" y="470" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#000000">item analysis, printable PDFs</text>

  <!-- Admin to System (left of vertical) -->
  <line x1="560" y1="130" x2="540" y2="235" stroke="#000000" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="470" y="175" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#000000">Teacher approval</text>
  <text x="470" y="190" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#000000">Access decisions</text>

  <!-- System to Admin (right of vertical) -->
  <line x1="660" y1="235" x2="640" y2="130" stroke="#000000" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="730" y="175" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#000000">Pending teachers,</text>
  <text x="730" y="190" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#000000">school overview data</text>

  <!-- Sheet to System -->
  <line x1="960" y1="345" x2="735" y2="300" stroke="#000000" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="860" y="300" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#000000">Shaded bubbles,</text>
  <text x="860" y="315" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#000000">OMR ID marks</text>

  <!-- System context: print produces sheets used in exam (dashed conceptual) -->
  <line x1="735" y1="440" x2="960" y2="395" stroke="#000000" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="850" y="455" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#000000">Blank printable sheet</text>
  <text x="850" y="470" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#000000">layout (via teacher print)</text>

  <!-- Note -->
  <text x="600" y="620" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#444444">
    Note: A student is an examinee on the roster and sheet, not a logged-in system actor.
  </text>
  <text x="600" y="640" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#444444">
    Internal stores (SQLite, PostgreSQL) and subprocesses are shown in the Level 1 DFD (Figure 4.13).
  </text>

  <!-- Caption -->
  <text x="600" y="720" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#000000">
    Figure 4.12. Context-Level (Level 0) Data Flow Diagram for the hybrid OMR system
  </text>
</svg>
