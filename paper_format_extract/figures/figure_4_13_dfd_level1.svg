<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1000" viewBox="0 0 1500 1000" role="img" aria-label="Figure 4.13 Level 1 Data Flow Diagram">
  <rect width="1500" height="1000" fill="#ffffff"/>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0,1 L9,5 L0,9 Z" fill="#000000"/>
    </marker>
  </defs>

  <!-- External: Teacher -->
  <rect x="40" y="400" width="150" height="70" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="115" y="430" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#000000">Teacher</text>
  <text x="115" y="450" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#333333">(Instructor)</text>

  <!-- External: School Administrator -->
  <rect x="620" y="25" width="210" height="58" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="725" y="48" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#000000">School Administrator</text>
  <text x="725" y="66" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#333333">(Approval / oversight)</text>

  <!-- External: OMR Sheet -->
  <rect x="1290" y="145" width="170" height="70" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="1375" y="175" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#000000">OMR Answer Sheet</text>
  <text x="1375" y="195" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#333333">(Printed exam form)</text>

  <!-- Process 1.0 -->
  <circle cx="320" cy="160" r="64" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="320" y="146" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#000000">1.0</text>
  <text x="320" y="164" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#000000">Prepare Roster</text>
  <text x="320" y="180" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#000000">&amp; Answer Keys</text>

  <!-- Process 2.0 -->
  <circle cx="580" cy="160" r="64" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="580" y="146" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#000000">2.0</text>
  <text x="580" y="164" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#000000">Generate / Print</text>
  <text x="580" y="180" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#000000">OMR Sheets</text>

  <!-- Process 3.0 -->
  <circle cx="940" cy="160" r="64" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="940" y="142" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#000000">3.0</text>
  <text x="940" y="160" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#000000">Capture &amp; Read</text>
  <text x="940" y="176" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#000000">OMR (OpenCV)</text>

  <!-- Process 4.0 -->
  <circle cx="940" cy="360" r="64" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="940" y="346" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#000000">4.0</text>
  <text x="940" y="364" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#000000">Review Flagged</text>
  <text x="940" y="380" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#000000">Scans</text>

  <!-- Process 5.0 -->
  <circle cx="650" cy="450" r="64" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="650" y="436" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#000000">5.0</text>
  <text x="650" y="454" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#000000">Persist Local</text>
  <text x="650" y="470" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#000000">Records</text>

  <!-- Process 6.0 -->
  <circle cx="430" cy="650" r="64" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="430" y="636" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#000000">6.0</text>
  <text x="430" y="654" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#000000">Synchronize</text>
  <text x="430" y="670" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#000000">(JSON / API)</text>

  <!-- Process 7.0 -->
  <circle cx="900" cy="720" r="64" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="900" y="706" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#000000">7.0</text>
  <text x="900" y="724" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#000000">Teacher Web</text>
  <text x="900" y="740" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#000000">Analysis</text>

  <!-- D1 store -->
  <line x1="240" y1="310" x2="500" y2="310" stroke="#000000" stroke-width="2"/>
  <line x1="240" y1="370" x2="500" y2="370" stroke="#000000" stroke-width="2"/>
  <line x1="240" y1="310" x2="240" y2="370" stroke="#000000" stroke-width="2"/>
  <text x="370" y="335" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#000000">D1 On-device SQLite</text>
  <text x="370" y="354" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#333333">Roster, keys, scores, sync flags; photos local</text>

  <!-- D2 store -->
  <line x1="1100" y1="580" x2="1360" y2="580" stroke="#000000" stroke-width="2"/>
  <line x1="1100" y1="640" x2="1360" y2="640" stroke="#000000" stroke-width="2"/>
  <line x1="1100" y1="580" x2="1100" y2="640" stroke="#000000" stroke-width="2"/>
  <text x="1230" y="605" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#000000">D2 Server PostgreSQL</text>
  <text x="1230" y="624" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#333333">Accounts, approval, synced academic rows</text>

  <!-- Data flows -->
  <g stroke="#000000" stroke-width="1.35" fill="none" marker-end="url(#arrow)">
    <!-- Teacher -> 1.0 -->
    <path d="M190,410 L270,210"/>
    <!-- Teacher -> 2.0 print request -->
    <path d="M115,400 L115,90 L520,90 L530,120"/>
    <!-- Teacher -> 4.0 -->
    <path d="M190,430 L876,360"/>
    <!-- Teacher -> 6.0 -->
    <path d="M115,470 L115,650 L366,650"/>
    <!-- 7.0 -> Teacher -->
    <path d="M836,720 L115,720 L115,470"/>

    <!-- 1.0 -> D1 -->
    <line x1="320" y1="224" x2="320" y2="310"/>
    <!-- 1.0 -> 2.0 -->
    <line x1="384" y1="160" x2="516" y2="160"/>
    <!-- D1 -> 2.0 -->
    <line x1="450" y1="310" x2="530" y2="210"/>
    <!-- 2.0 -> Sheet -->
    <line x1="644" y1="160" x2="1290" y2="170"/>
    <!-- Sheet -> 3.0 -->
    <line x1="1290" y1="185" x2="1004" y2="170"/>
    <!-- D1 -> 3.0 -->
    <path d="M500,340 L820,340 L870,210"/>
    <!-- 3.0 -> 4.0 -->
    <line x1="940" y1="224" x2="940" y2="296"/>
    <!-- 4.0 -> 5.0 -->
    <line x1="876" y1="380" x2="714" y2="430"/>
    <!-- 5.0 -> D1 -->
    <line x1="586" y1="430" x2="500" y2="360"/>
    <!-- D1 -> 6.0 -->
    <line x1="320" y1="370" x2="390" y2="600"/>
    <!-- 6.0 -> D2 -->
    <line x1="494" y1="650" x2="1100" y2="610"/>
    <!-- D2 -> 6.0 -->
    <path d="M1100,620 L700,620 L490,665"/>
    <!-- 6.0 -> D1 apply updates -->
    <path d="M400,610 L260,610 L260,370"/>
    <!-- Admin -> D2 -->
    <path d="M830,83 L830,120 L1230,120 L1230,580"/>
    <!-- D2 -> Admin -->
    <path d="M1300,580 L1400,580 L1400,40 L830,40"/>
    <!-- D2 -> 7.0 -->
    <line x1="1100" y1="610" x2="964" y2="700"/>
  </g>

  <!-- Labels -->
  <g font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#000000">
    <text x="185" y="290">Roster, keys,</text>
    <text x="185" y="303">PIN unlock</text>

    <text x="330" y="280">Write sections,</text>
    <text x="330" y="293">students, keys</text>

    <text x="450" y="148">Layout / OMR IDs</text>
    <text x="280" y="82">Print request</text>
    <text x="500" y="270">Roster + IDs</text>

    <text x="1080" y="148">Blank printable PDF</text>
    <text x="1160" y="210">Shaded bubbles,</text>
    <text x="1160" y="223">OMR ID marks</text>

    <text x="700" y="320">Key + roster for scoring</text>

    <text x="960" y="270">Raw readings,</text>
    <text x="960" y="283">confidence flags</text>

    <text x="520" y="395">Accept / edit / reject</text>
    <text x="790" y="420">Confirmed scores</text>
    <text x="520" y="415">Scores + sync flags</text>
    <text x="520" y="428">(photos stay local)</text>

    <text x="140" y="600">Sync request</text>
    <text x="250" y="520">Academic JSON</text>
    <text x="250" y="533">(no photos)</text>
    <text x="780" y="595">Upsert rows</text>
    <text x="740" y="680">Cloud status / updates</text>
    <text x="250" y="595">Apply updates</text>

    <text x="980" y="145"></text>
    <text x="1280" y="105">Approval decisions</text>
    <text x="1410" y="75">Pending teachers,</text>
    <text x="1410" y="88">school overview</text>

    <text x="1040" y="690">Synced scans / keys</text>
    <text x="220" y="750">Item analysis, CSV / PDF</text>
  </g>

  <text x="750" y="860" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#444444">
    Offline-first rule: write to D1 first; synchronize academic rows to D2 when connectivity is available. Scan photographs are not uploaded.
  </text>
  <text x="750" y="880" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#444444">
    Decomposition of Process 0 (Figure 4.12). A student is an examinee on the roster/sheet, not an external logged-in entity.
  </text>
  <text x="750" y="940" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#000000">
    Figure 4.13. Level 1 Data Flow Diagram mapping sub-process logic, data streams, and active data stores
  </text>
</svg>
