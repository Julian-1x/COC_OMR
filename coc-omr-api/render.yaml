# Render.com blueprint (optional pilot — free DB expires; service sleeps when idle).
# See laravel/FREE_CLOUD.md

services:
  - type: web
    name: coc-omr-api
    runtime: docker
    plan: free
    healthCheckPath: /up
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_KEY
        generateValue: true
      - key: AUTO_VERIFY_EMAIL
        value: false
      - key: FRONTEND_URL
        sync: false
      - key: MOBILE_VERIFY_REDIRECT
        value: edu.coc.omr://login-callback
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_URL
        fromDatabase:
          name: coc-omr-db
          property: connectionString
      - key: LOG_CHANNEL
        value: stderr

databases:
  - name: coc-omr-db
    plan: free
    databaseName: coc_omr
    user: coc_omr
