# Render Blueprint — deploy from GitHub repo root (monorepo).
# Dashboard: New → Blueprint → connect Julian-1x/COC_OMR
# See laravel/FREE_CLOUD.md

services:
  - type: web
    name: coc-omr-api
    runtime: docker
    plan: free
    # Must match the Neon database region (ap-southeast-1). A US service pays
    # ~1.6s per connection + ~0.5s per query talking to Singapore, which made
    # every authenticated request take ~4s. Render cannot change the region of
    # an existing service — recreate the service if it is not in Singapore.
    region: singapore
    rootDir: coc-omr-api
    healthCheckPath: /up
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_KEY
        generateValue: true
      - key: AUTO_VERIFY_EMAIL
        value: false
      - key: FRONTEND_URL
        value: https://omrweb.vercel.app
      - key: MOBILE_VERIFY_REDIRECT
        value: edu.coc.omr://login-callback
      - key: DB_CONNECTION
        value: pgsql
      - key: DATABASE_URL
        fromDatabase:
          name: coc-omr-db
          property: connectionString
      - key: DB_URL
        fromDatabase:
          name: coc-omr-db
          property: connectionString
      - key: LOG_CHANNEL
        value: stderr
      # Neon pooler + Laravel database cache transactions cause login 500 (SQLSTATE 25P02).
      - key: CACHE_STORE
        value: file
      - key: SESSION_DRIVER
        value: file
      - key: SANCTUM_STATEFUL_DOMAINS
        value: omrweb.vercel.app
      - key: MAIL_MAILER
        value: smtp
      - key: MAIL_HOST
        value: smtp-relay.brevo.com
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_ENCRYPTION
        value: tls
      - key: MAIL_FROM_ADDRESS
        value: alex.balaba.coc@phinmaed.com
      - key: MAIL_FROM_NAME
        value: COC OMR

databases:
  - name: coc-omr-db
    plan: free
    databaseName: coc_omr
    user: coc_omr
